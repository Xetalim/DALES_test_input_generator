  #   iadv_thl: 2 # necessary for IBM to work
  #   iadv_qt: 2 # necessary for IBM to work
  #   iadv_sv: 2 # necessary for IBM to work
  #   ibas_prf: 2 # necessary for IBM to work
  OPENBC:
    lopenbc: true
    linithetero: true
    lper: false
    lbuoytop: true
    dxint: 100
    dyint: 100
    dzint: -1
    dxturb: -1
    dyturb: -1
    taum: 0 # some timescale
    tauh: 20 # some timescale
    pbc: 3 #unknown
    lsynturb: false
    iturb: 0
    tau: 180 # some timescale
    lambda: 1
    nmodes: 100
    lambdas: 1
    lambdas_x: 1
    lambdas_y: 1
    lambdas_z: 1
    lbuoytop: false
  NAMCROSSSECTION:
    dtav: 10
    lcross: true
    lbinary: false
    crossheight: []
    crossplane: []
    crossortho: []
    lxy: true
    lxz: true
    lyz: true

