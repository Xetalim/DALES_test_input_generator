output:
  name: 001_slurb_again
  path: null
  plot: true

input_template:
  namoptions_file: 'namoptions.001'
generation_settings:
  uselsm: true # set false to disable lsm
  useslurb: true
  useibm: false
profile:
  grid:
    # define Nz in namelist overrides instead
    stretch: false
    alpha_stretch: 1.01
    dz: 20

  profiles:
    ua:
      shape: lin
      params:
        surf_val: -3 #u0 m/s
        ddz: 0.0022 #dudz
    va:
      shape: lin
      params:
        surf_val: 3 #v0 m/s
        ddz: 0.0022 # dvdz
    wa: # large scale subsidence
      shape: expsinw
      params:
        surf_val: 4.0e-3 #w0 subsidence, positive is downwards
        amp: 0 #wpamp sine shape amplitude
        H: 2500 #Hw subsidence height scale
        Hp: 5300 #Hwp
    thetal:
      shape: linmlsurf
      params:
        lapse_rate: 1.0e-3 # lapse rate K/m (NOT K/km so divide for example 1K/km by 1000)
        surf_val: 298.5 # sea surface thl
        offset_val: 1.25 # surface thl offset from this
        z_ml: 0
    qt:
      shape: exp # this is with mixed layer still
      params:
        surf_val: 0.016 # qt_0 kg/kg
        lambda_val: 1500 # qt_lambda
        z_ml: 0
  interpolated:
    tke:
      z: [0, 4000, 5000]
      points: [1, 1e-8, 1e-8]
      fill_value: extrapolate
    tnqt_adv:
      z: [0, 4000, 20000]
      points: [0, 0, 0]
      fill_value: 0
    tnthetal_rad:
      z: [0, 0, 20000]
      points: [0, 0, 0]
      fill_value: 0

namelist_overrides:
  RUN:
    iexpnr: 001
    runtime: 3600
  DOMAIN:
    itot: 4
    jtot: 4
    kmax: 16
    xsize: 1600
    ysize: 1600
  NAMFIELDDUMP:
    dtav: 60 # change this for more frequent field dumps (time between dumps in sec)
  # NAMIBM:
  #   lapply_ibm: false # Activate immersed boundary method
  #   lwallheat: false # No heat flux from walls
  #   thlibm: 301 # IBM reference theta_l [K] (not used)
  #   thlwall: 301 # Wall theta_l [K] (not used)
  #   thlroof: 301 # Roof theta_l [K] (not used)
  #   qtibm: 0.001 # IBM reference qt [kg/kg]
  DYNAMICS:
    iadv_mom: 2 # necessary for IBM to work
    iadv_tke: 2 # necessary for IBM to work
    iadv_thl: 2 # necessary for IBM to work
    iadv_qt: 2 # necessary for IBM to work
    iadv_sv: 2 # necessary for IBM to work
    ibas_prf: 2 # necessary for IBM to work
  NAMLSM:
    nlu: 11
  # NAMLSMCROSSSECTION:
  #   dtav: 1
  NAMSLURB:
    urban_fraction: 0.5
    urban_roughness_length: 0.5
    building_plan_area_fraction: 0.3
    building_frontal_area_fraction: 0.11
    building_height: 20.0
    window_fraction: 0.2
    street_canyon_aspect_ratio: 0.5
    building_type: 2
    pavement_type: 2
    anisotropic_street_canyons: false
    street_canyon_orientation: 0
    # deep_soil_temperature: 295.0
    # building_indoor_temperature: 295
    shf_external: 0
    qsws_external: 0

