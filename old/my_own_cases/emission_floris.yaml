output:
  name: 18_emission_floris
  path: null
  plot: true

input_template:
  namoptions_file: 'namoptions.001'
generation_settings:
  uselsm: false # set false to disable lsm
  useslurb: false
  useopenBC: false
  useibm: true

profile:
  grid:
    # define Nz in namelist overrides instead
    stretch: false
    alpha_stretch: 1.0
    dz: 10

  profiles:
    ua:
      shape: lin
      params:
        surf_val: 5 #u0 m/s
        ddz: 0.0022 #dudz
    va:
      shape: lin
      params:
        surf_val: 0 #v0 m/s
        ddz: 0.000 # dvdz
    wa: # large scale subsidence
      shape: expsinw
      params:
        surf_val: 4.0e-3 #w0 subsidence, positive is downwards
        amp: 0 #wpamp sine shape amplitude
        H: 2500 #Hw subsidence height scale
        Hp: 5300 #Hwp
    thetal:
      shape: linmlsurf
      params:
        lapse_rate: 1.0e-3 # lapse rate K/m (NOT K/km so divide for example 1K/km by 1000)
        surf_val: 298.5 # sea surface thl
        offset_val: 1.25 # surface thl offset from this
        z_ml: 0
    qt:
      shape: exp # this is with mixed layer still
      params:
        surf_val: 0.016 # qt_0 kg/kg
        lambda_val: 1500 # qt_lambda
        z_ml: 0
  interpolated:
    tke:
      z: [0, 4000, 5000]
      points: [1, 1e-8, 1e-8]
      fill_value: extrapolate
    tnqt_adv:
      z: [0, 4000, 20000]
      points: [0, 0, 0]
      fill_value: 0
    tnthetal_rad:
      z: [0, 0, 20000]
      points: [0, 0, 0]
      fill_value: 0

namelist_overrides:
  RUN:
    iexpnr: 001
    runtime: 3600
  DOMAIN:
    itot: 64
    jtot: 32
    kmax: 60
    xsize: 640
    ysize: 320
    xtime: 0
  PHYSICS:
    thls: 293
  NAMDATETIME:
    l_datetime: true
    startyear: 2025
    startmonth: 10
    startday: 28
    timezone: 0
  NAMSURFACE:
    isurf: 2
    wtsurf: 0.000
    wqsurf: 0.000
  NAMFIELDDUMP:
    dtav: 1 # change this for more frequent field dumps (time between dumps in sec)
  NAMIBM:
    lapply_ibm: true # Activate immersed boundary method
    lwallheat: false # No heat flux from walls
    thlibm: 301 # IBM reference theta_l [K] (not used)
    thlwall: 301 # Wall theta_l [K] (not used)
    thlroof: 301 # Roof theta_l [K] (not used)
    qtibm: 0.001 # IBM reference qt [kg/kg]
  DYNAMICS:
    iadv_mom: 2 # necessary for IBM to work
    iadv_tke: 2 # necessary for IBM to work
    iadv_thl: 2 # necessary for IBM to work
    iadv_qt: 2 # necessary for IBM to work
    iadv_sv: 2 # necessary for IBM to work
    ibas_prf: 2 # necessary for IBM to work
  NAMEMISSION:
    l_emission: true
    l_points: true
    explicit_plume_rise: false
    nemis: 1
    emisnames: ['co2']

land_use_modifications:
  - geometry: 'all'
    type: 'aqu'
    params:
ibm_modifications:
  - geometry: 'all'
    height: 0
    params:
  - geometry: 'circle_idx'
    height: 50
    params:
      idx0: 32
      idy0: 16
      size: 3
  # - geometry: circle_idx
  #   type: 'aqu'
  #   params:
  #     idx0: 16
  #     idy0: 16
  #     size: 5
emissions:
  tracer_types:
    - name: co2
      long_name: "Carbon Dioxide (CO2)"
      unit: "ppm"
      molar_mass: 44.009 # g/mol
      lemis: true
      lreact: false
      ldep: false
      lags: false
  point_sources:
      co2:
        - x_idx: 10
          y_idx: 16
          height: 20
          temperature: 293 # K
          volume: 1
          emission: 10
