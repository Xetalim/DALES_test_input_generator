output:
  name: 15_openboundary_loris
  path: null
  plot: true

input_template:
  namoptions_file: 'namoptions.001'
generation_settings:
  uselsm: true # set false to disable lsm
  useslurb: false
  useopenBC: true
profile:
  grid:
    # define Nz in namelist overrides instead
    stretch: false
    alpha_stretch: 1
    dz: 10
    x0: 60000
    y0: 50000

  profiles:
    ua:
      shape: lin
      params:
        surf_val: -3 #u0 m/s
        ddz: 0.0022 #dudz
    va:
      shape: lin
      params:
        surf_val: 3 #v0 m/s
        ddz: 0.0022 # dvdz
    wa: # large scale subsidence
      shape: expsinw
      params:
        surf_val: 4.0e-3 #w0 subsidence, positive is downwards
        amp: 0 #wpamp sine shape amplitude
        H: 2500 #Hw subsidence height scale
        Hp: 5300 #Hwp
    thetal:
      shape: linmlsurf
      params:
        lapse_rate: 1.0e-3 # lapse rate K/m (NOT K/km so divide for example 1K/km by 1000)
        surf_val: 298.5 # sea surface thl
        offset_val: 1.25 # surface thl offset from this
        z_ml: 0
    qt:
      shape: exp # this is with mixed layer still
      params:
        surf_val: 0.016 # qt_0 kg/kg
        lambda_val: 1500 # qt_lambda
        z_ml: 0
  interpolated:
    tke:
      z: [0, 4000, 5000]
      points: [1, 1e-8, 1e-8]
      fill_value: extrapolate
    tnqt_adv:
      z: [0, 4000, 20000]
      points: [0, 0, 0]
      fill_value: 0
    tnthetal_rad:
      z: [0, 0, 20000]
      points: [0, 0, 0]
      fill_value: 0

namelist_overrides:
  RUN:
    iexpnr: 001
    runtime: 86400
  DOMAIN:
    itot: 512
    jtot: 512
    kmax: 40
    xsize: 25600
    ysize: 25600
    ksp: 60
    xtime: 12
  NAMDATETIME:
    l_datetime: true
    startyear: 2025
    startmonth: 10
    startday: 28
    timezone: 0
  NAMSURFACE:
    ps: 102034.17950413124
    thls: 292.6027607924941
  PHYSICS:
    lconstexner: true
    igrw_damp: 0
  NAMFIELDDUMP:
    dtav: 600 # change this for more frequent field dumps (time between dumps in sec)
  # NAMIBM:
  #   lapply_ibm: false # Activate immersed boundary method
  #   lwallheat: false # No heat flux from walls
  #   thlibm: 301 # IBM reference theta_l [K] (not used)
  #   thlwall: 301 # Wall theta_l [K] (not used)
  #   thlroof: 301 # Roof theta_l [K] (not used)
  #   qtibm: 0.001 # IBM reference qt [kg/kg]
  # DYNAMICS:
  #   iadv_mom: 2 # necessary for IBM to work
  #   iadv_tke: 2 # necessary for IBM to work
  #   iadv_thl: 2 # necessary for IBM to work
  #   iadv_qt: 2 # necessary for IBM to work
  #   iadv_sv: 2 # necessary for IBM to work
  #   ibas_prf: 2 # necessary for IBM to work
  OPENBC:
    lopenbc: true
    linithetero: true
    lper: false
    lbuoytop: true
    dxint: 100
    dyint: 100
    dzint: -1
    dxturb: -1
    dyturb: -1
    taum: 0 # some timescale
    tauh: 20 # some timescale
    pbc: 3 #unknown
    lsynturb: false
    iturb: 0
    tau: 180 # some timescale
    lambda: 1
    nmodes: 100
    lambdas: 1
    lambdas_x: 1
    lambdas_y: 1
    lambdas_z: 1
    lbuoytop: false
  NAMCROSSSECTION:
    dtav: 10
    lcross: true
    lbinary: false
    crossheight: []
    crossplane: []
    crossortho: []
    lxy: true
    lxz: true
    lyz: true

