output:
  name: 05_64x64_ocean
  path: null
  plot: true

input_template:
  namoptions_file: 'namoptions.001'
generation_settings:
  uselsm: true # set false to disable lsm
profile:
  grid:
    # define Nz in namelist overrides instead
    stretch: false
    alpha_stretch: 1.01
    dz: 20

  profiles:
    ua:
      shape: lin
      params:
        surf_val: 1 #u0 m/s
        ddz: 0.001 #dudz
    va:
      shape: lin
      params:
        surf_val: 0 #v0 m/s
        ddz: 0.0 # dvdz
    wa: # large scale subsidence
      shape: expsinw
      params:
        surf_val: 0 #w0 subsidence, positive is downwards
        amp: 0 #wpamp sine shape amplitude
        H: 2500 #Hw subsidence height scale
        Hp: 5300 #Hwp
    thetal:
      shape: linmlsurf
      params:
        lapse_rate: 3.0e-3 # lapse rate K/m (NOT K/km so divide for example 1K/km by 1000)
        surf_val: 250.15 # sea surface thl
        offset_val: 0 # surface thl offset from this
        z_ml: 0
    qt:
      shape: linmlsurf # this is with mixed layer still
      params:
        surf_val: 0.016 # qt_0 kg/kg
        lapse_rate: 0
        offset_val: 0
        z_ml: 0
  interpolated:
    tke:
      z: [0, 4000, 5000]
      points: [1, 1e-8, 1e-8]
      fill_value: extrapolate
    tnqt_adv:
      z: [0, 4000, 20000]
      points: [0, 0, 0]
      fill_value: 0
    tnthetal_rad:
      z: [0, 0, 20000]
      points: [0, 0, 0]
      fill_value: 0

namelist_overrides:
  RUN:
    iexpnr: 001
    runtime: 3600
    trestart: 21600
  DOMAIN:
    itot: 64
    jtot: 64
    kmax: 64
    xsize: 640
    ysize: 640
  NAMFIELDDUMP:
    dtav: 10 # change this for more frequent field dumps (time between dumps in sec)
  NAMCAPE: # for liquid,rain,total water path LWP, RWP, TWP
    dtav: 10
  NAMLSMCROSSSECTION:
    dtav: 10

land_use_modifications:
  - geometry: 'all'
    type: 'aqu'
    params:
