output:
  name: 11_emission_test_test
  path: null
  plot: true
input_template:
  namoptions_file: 'namoptions.001'
generation_settings:
  uselsm: false # set false to disable lsm
profile:
  grid:
    # define kmax in namelist overrides instead
    stretch: false
    alpha_stretch: 1.01
    dz: 20

  profiles:
    u:
      shape: lin
      params:
        surf_val: -3 #u0 m/s
        ddz: 0.0022 #dudz
    v:
      shape: lin
      params:
        surf_val: 3 #v0 m/s
        ddz: 0.0022 # dvdz
    w:
      shape: expsinw
      params:
        surf_val: 4.0e-3 #w0 subsidence, positive is downwards
        amp: 0 #wpamp sine shape amplitude
        H: 2500 #Hw subsidence height scale
        Hp: 5300 #Hwp
    thl:
      shape: linmlsurf
      params:
        lapse_rate: 1.0e-3 # lapse rate K/m (NOT K/km so divide for example 1K/km by 1000)
        surf_val: 298.5 # sea surface thl
        offset_val: 1.25 # surface thl offset from this
        z_ml: 0
    qt:
      shape: exp # this is with mixed layer still
      params:
        surf_val: 0.016 # qt_0 kg/kg
        lambda_val: 1500 # qt_lambda
        z_ml: 0
  interpolated:
    tke:
      z: [0, 4000, 5000]
      points: [1, 1e-8, 1e-8]
      fill_value: extrapolate
    qt_tend:
      z: [0, 4000, 20000]
      points: [0, 0, 0]
      fill_value: 0
    thl_tend:
      z: [0, 0, 20000]
      points: [0, 0, 0]
      fill_value: 0

namelist_overrides:
  RUN:
    iexpnr: 001
    runtime: 3600
  DOMAIN:
    itot: 64
    jtot: 64
    xsize: 6400
    ysize: 6400
    kmax: 64
    xtime: 12
  PHYSICS:
    thls: 295
  NAMDATETIME:
    l_datetime: true
    startyear: 2025
    startmonth: 10
    startday: 28
    timezone: 0
  NAMFIELDDUMP:
    dtav: 60 # change this for more frequent field dumps (time between dumps in sec)
  NAMFIELDDUMP:
    dtav: 60 # change this for more frequent field dumps (time between dumps in sec)
    # namelist/NAMEMISSION/ l_emission, l_points, explicit_plume_rise, kemis, nemis, emisnames, l_scale, scalefactor
  NAMEMISSION:
    l_emission: true
    l_points: true
    explicit_plume_rise: false
    nemis: 1
    emisnames: ['co2']
  NAMIBM:
    lapply_ibm: true # Activate immersed boundary method
    lwallheat: false # No heat flux from walls
    thlibm: 301 # IBM reference theta_l [K] (not used)
    thlwall: 301 # Wall theta_l [K] (not used)
    thlroof: 301 # Roof theta_l [K] (not used)
    qtibm: 0.001 # IBM reference qt [kg/kg]
  DYNAMICS:
    iadv_mom: 2 # necessary for IBM to work
    iadv_tke: 2 # necessary for IBM to work
    iadv_thl: 2 # necessary for IBM to work
    iadv_qt: 2 # necessary for IBM to work
    iadv_sv: 2 # necessary for IBM to work
    ibas_prf: 2 # necessary for IBM to work
ibm_modifications:
  - geometry: 'all'
    height: 0
    params:
  - geometry: rectangle_idx
    height: 50
    params:
      minx: 30
      maxx: 34
      miny: 30
      maxy: 34
  - geometry: circle_idx
    height: 50
    params:
      idx0: 16
      idy0: 16
      size: 4
  - geometry: circle_idx
    height: 50
    params:
      idx0: 48
      idy0: 16
      size: 8